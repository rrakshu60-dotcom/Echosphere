[platformio]
src_dir = .
default_envs = esp32dev

; Primary Environment: Classic 38-Pin ESP-32 NodeMCU / ESP32 Dev Module (ESP-WROOM-32)
; Works with onboard CH340 / CP2102 USB-to-UART bridge
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
monitor_speed = 115200
; Prevent CH340 / CP210x DTR/RTS glitch from holding chip in bootloader or reset
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Alternative environment for specific NodeMCU-32S board variants
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Legacy / Secondary: ESP32-S3 DevKitC-1
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
