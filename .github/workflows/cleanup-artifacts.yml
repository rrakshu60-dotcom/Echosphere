name: Clean Up GitHub Actions Storage

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: write
  deployments: write

jobs:
  cleanup-artifacts:
    name: Purge Accumulated Artifacts & Stale Deployments
    runs-on: ubuntu-latest
    steps:
      - name: Delete All Stored Workflow Artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let totalDeleted = 0;
            let totalBytes = 0;

            console.log(`Scanning for workflow artifacts in ${owner}/${repo}...`);

            let page = 1;
            while (true) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: owner,
                repo: repo,
                per_page: 100,
                page: page
              });

              const artifacts = res.data.artifacts;
              if (!artifacts || artifacts.length === 0) {
                break;
              }

              for (const artifact of artifacts) {
                console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id}, Size: ${(artifact.size_in_bytes / (1024 * 1024)).toFixed(2)} MB)`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: owner,
                    repo: repo,
                    artifact_id: artifact.id
                  });
                  totalDeleted++;
                  totalBytes += artifact.size_in_bytes;
                } catch (err) {
                  console.warn(`Failed to delete artifact ${artifact.id}: ${err.message}`);
                }
              }

              if (artifacts.length < 100) {
                break;
              }
              page++;
            }

            const totalMB = (totalBytes / (1024 * 1024)).toFixed(2);
            console.log(`Cleanup complete! Deleted ${totalDeleted} artifacts, freeing approx ${totalMB} MB.`);

            // Purge stale Vercel deployments
            console.log('Scanning for stale Vercel deployments...');
            try {
              const depRes = await github.rest.repos.listDeployments({
                owner: owner,
                repo: repo,
                per_page: 100
              });
              for (const dep of (depRes.data || [])) {
                const env = (dep.environment || '').toLowerCase();
                const desc = (dep.description || '').toLowerCase();
                const creator = (dep.creator?.login || '').toLowerCase();
                if (env.includes('vercel') || desc.includes('vercel') || creator.includes('vercel')) {
                  console.log(`Deactivating stale deployment ${dep.id} (${dep.environment})...`);
                  try {
                    await github.rest.repos.createDeploymentStatus({
                      owner,
                      repo,
                      deployment_id: dep.id,
                      state: 'inactive'
                    });
                  } catch (e) {
                    console.warn(`Could not set status inactive for ${dep.id}:`, e.message);
                  }
                  try {
                    await github.rest.repos.deleteDeployment({
                      owner,
                      repo,
                      deployment_id: dep.id
                    });
                    console.log(`Deleted stale deployment ${dep.id}`);
                  } catch (e) {
                    console.warn(`Could not delete deployment ${dep.id}:`, e.message);
                  }
                }
              }
            } catch (err) {
              console.warn('Deployment cleanup notice:', err.message);
            }
