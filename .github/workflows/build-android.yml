name: EchoSphere Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Shallow Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Stabilize Network (Force IPv4 & Configure cURL Retries)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          echo "--retry 5 --retry-delay 3 --retry-all-errors" >> ~/.curlrc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache Android Engine Only
        run: flutter precache --android

      - name: Cache Pub Dependencies & Dart Tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: flutter-cache-android-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            flutter-cache-android-${{ runner.os }}-

      - name: Install Dependencies
        run: cd frontend && flutter pub get

      - name: Build Android Debug APK (Arm64 Optimized)
        run: cd frontend && flutter build apk --debug --no-pub --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Copy & Rename APK
        run: cp frontend/build/app/outputs/flutter-apk/app-debug.apk frontend/echosphere-app-debug.apk

      - name: Publish to GitHub Releases (Immediate Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EchoSphere Latest Build"
          body: |
            ## EchoSphere Automated Build
            
            ### 📱 Android Installation:
            Download **`echosphere-app-debug.apk`** below directly to your Android device, open it, and tap **Install**.
          draft: false
          prerelease: false
          files: frontend/echosphere-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Temporary APK Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-android-apk
          path: frontend/echosphere-app-debug.apk
          retention-days: 1
