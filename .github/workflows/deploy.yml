name: EchoSphere Multi-Platform Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build & Deploy Web App (GitHub Pages)
  # ------------------------------------------------------------------
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Web App
        run: |
          cd frontend
          flutter build web --release --no-wasm-dry-run --base-href /Echosphere/

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web

  # ------------------------------------------------------------------
  # Job 2: Build Android APK
  # ------------------------------------------------------------------
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Android Debug APK
        run: |
          cd frontend
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

  # ------------------------------------------------------------------
  # Job 3: Build Windows Desktop App
  # ------------------------------------------------------------------
  build-windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows App
        run: |
          cd frontend
          flutter build windows --release --no-pub

      - name: Compress Windows Build
        run: |
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath frontend/echosphere-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-windows-app
          path: frontend/echosphere-windows.zip
