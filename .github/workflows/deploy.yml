name: EchoSphere Deployment Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - 'wrangler.json'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: Ultra-Fast Cloudflare Direct Upload (~4 seconds total!)
  # ------------------------------------------------------------------
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Direct Cloudflare Pages Upload
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'echosphere'
          directory: 'frontend/build/web'
          branch: 'main'

  # ------------------------------------------------------------------
  # Job 2: Build Android APK (Runs only on release tags v* or manual trigger)
  # ------------------------------------------------------------------
  build-android-apk:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Android Debug APK
        run: |
          cd frontend
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

  # ------------------------------------------------------------------
  # Job 3: Build Windows Desktop App (Runs only on release tags v* or manual trigger)
  # ------------------------------------------------------------------
  build-windows-app:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows App
        run: |
          cd frontend
          flutter build windows --release --no-pub

      - name: Compress Windows Build
        run: |
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath frontend/echosphere-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-windows-app
          path: frontend/echosphere-windows.zip
