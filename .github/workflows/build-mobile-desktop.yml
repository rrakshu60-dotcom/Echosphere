name: EchoSphere Mobile & Desktop Builds

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-mobile-desktop.yml'
  workflow_dispatch:

concurrency:
  group: build-mobile-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build Android Debug APK (Primary Target - ~4 mins)
  # ------------------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Fast Disk Space Optimization (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Stabilize Network (Force IPv4 & Configure cURL Retries)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          echo "--retry 5 --retry-delay 3 --retry-all-errors" >> ~/.curlrc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: cd frontend && flutter pub get

      - name: Build Android Debug APK
        run: cd frontend && flutter build apk --debug --android-skip-build-dependency-validation

      - name: Copy & Rename APK
        run: cp frontend/build/app/outputs/flutter-apk/app-debug.apk frontend/echosphere-app-debug.apk

      - name: Publish Android APK to GitHub Releases (Immediate Availability)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EchoSphere Latest Build"
          body: |
            ## EchoSphere Automated Build
            
            ### 📱 Android Installation:
            Download **`echosphere-app-debug.apk`** below directly to your Android device, open it, and tap **Install**.
            
            ### 💻 Windows Installation:
            Download **`echosphere-windows.zip`**, extract the folder, and run `echosphere.exe`.
          draft: false
          prerelease: false
          files: frontend/echosphere-app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Temporary APK Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-android-apk
          path: frontend/echosphere-app-debug.apk
          retention-days: 1

  # ------------------------------------------------------------------
  # Job 2: Build Windows Desktop App (Independent Parallel Job)
  # ------------------------------------------------------------------
  build-windows-app:
    name: Build Windows Desktop App
    if: "!contains(github.event.head_commit.message, '[skip-windows]')"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-cache-windows-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            pub-cache-windows-

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: cd frontend && flutter pub get

      - name: Build Windows App
        run: cd frontend && flutter build windows --release --no-pub

      - name: Compress Windows Build
        run: Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath frontend/echosphere-windows.zip

      - name: Publish Windows App to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EchoSphere Latest Build"
          draft: false
          prerelease: false
          files: frontend/echosphere-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Temporary Windows Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-windows-app
          path: frontend/echosphere-windows.zip
          retention-days: 1
