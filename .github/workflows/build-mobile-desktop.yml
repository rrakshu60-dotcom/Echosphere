name: EchoSphere Mobile & Desktop Builds

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-mobile-desktop.yml'
  workflow_dispatch:

concurrency:
  group: build-mobile-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build Android Debug APK
  # ------------------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stabilize Network (Force IPv4 & Configure cURL Retries)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
          echo "--retry 5 --retry-delay 3 --retry-all-errors" >> ~/.curlrc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: cd frontend && flutter pub get

      - name: Build Android Debug APK
        run: cd frontend && flutter build apk --debug --android-skip-build-dependency-validation

      - name: Copy & Rename APK
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-debug.apk frontend/echosphere-app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-android-apk
          path: frontend/echosphere-app-debug.apk

  # ------------------------------------------------------------------
  # Job 2: Build Windows Desktop App
  # ------------------------------------------------------------------
  build-windows-app:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: cd frontend && flutter pub get

      - name: Build Windows App
        run: cd frontend && flutter build windows --release --no-pub

      - name: Compress Windows Build
        run: Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath frontend/echosphere-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosphere-windows-app
          path: frontend/echosphere-windows.zip

  # ------------------------------------------------------------------
  # Job 3: Publish to GitHub Releases (Direct 1-Click APK Download)
  # ------------------------------------------------------------------
  release-builds:
    name: Publish to GitHub Releases
    needs: [build-android-apk, build-windows-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: echosphere-android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: echosphere-windows-app
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EchoSphere Latest Build"
          body: |
            ## EchoSphere Automated Build
            
            ### 📱 Android Installation:
            Download **`echosphere-app-debug.apk`** below directly to your Android device, open it, and tap **Install**.
            
            ### 💻 Windows Installation:
            Download **`echosphere-windows.zip`**, extract the folder, and run `echosphere.exe`.
          draft: false
          prerelease: false
          files: |
            release-assets/echosphere-app-debug.apk
            release-assets/echosphere-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

